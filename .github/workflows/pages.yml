name: Deploy portfolio to GitHub Pages

# Publish site/ whenever the public website changes. No installation or build.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload ready-to-serve website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
